[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferref"
version = "0.12.2"
description = "Reference execution tracing, testcase extraction and numerical comparison for inference engine development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

# Core (IR / codec / compare / testcase / region / inspect / CLI) depends on numpy only.
# PyTorch is NOT a core dependency: Trace IR v0.1 acceptance criterion #10 requires that a
# trace be readable without PyTorch installed.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# 2.1 is the verified floor, not a guess: CI runs the full suite against it.
# The tracer depends on private APIs (TorchDispatchMode, StorageWeakRef) and on
# `named_parameters(remove_duplicate=...)`, so the floor is asserted by test.
torch = ["torch>=2.1"]
# Generic Llama tracing/semantic integration is tested at the declared 4.40 floor.
hf = ["torch>=2.1", "transformers>=4.40"]
# Qwen3.5 is a separately tested capability; 5.14.1 is the verified floor.
qwen35 = ["torch>=2.1", "transformers>=5.14.1"]
agent = ["mcp>=2,<3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Blackwood416/InferRef"
Repository = "https://github.com/Blackwood416/InferRef"
Documentation = "https://github.com/Blackwood416/InferRef/blob/main/docs/index.md"
Changelog = "https://github.com/Blackwood416/InferRef/blob/main/CHANGELOG.md"
Issues = "https://github.com/Blackwood416/InferRef/issues"

[project.scripts]
inferref = "inferref.cli.main:main"
inferref-mcp = "inferref.agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["inferref"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/inferref",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that build and install a fixture distribution",
]
addopts = ["-m", "not slow"]

[tool.ruff.lint]
# Plugin isolation and environment diagnostics intentionally catch broad
# exceptions so a bad third-party comparator or optional runtime cannot crash
# the surrounding harness.
ignore = [
    "BLE001",
    "TRY004",
    "S110",
    "PYI034",
    "PYI036",
    "ISC004",
    "RUF007",
    "UP007",
]

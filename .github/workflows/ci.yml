name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The load-bearing job. InferRef's central claim is that a trace stays
  # readable when the framework that produced it is absent (Trace IR §57
  # criterion 10), so the core suite is run in an environment where torch was
  # never installed. If a torch import leaks into the IR, codec, comparator,
  # testcase, region or CLI read paths, this job fails.
  core:
    name: Core (no PyTorch) · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert PyTorch really is absent
        shell: python
        run: |
          import importlib.util, sys
          if importlib.util.find_spec("torch") is not None:
              sys.exit("torch is installed; this job must run without it")
          print("confirmed: torch is not installed")

      - name: Run core suite
        run: python -m pytest tests/core -q

  # MCP is an optional transport. This job proves that installing it does not
  # pull PyTorch into the framework-neutral Agent/IR/codec path.
  agent:
    name: Agent + MCP (no PyTorch) · ubuntu · py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core and Agent transport
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"

      - name: Assert PyTorch really is absent
        shell: python
        run: |
          import importlib.util, sys
          if importlib.util.find_spec("torch") is not None:
              sys.exit("torch is installed; Agent integration must remain framework-neutral")
          print("confirmed: torch is not installed")

      - name: Run core and Agent suites
        run: python -m pytest tests/core tests/agent -q

  # The frontend is allowed to break against a new PyTorch; the Trace IR is not.
  # That is why this matrix is separate and why `nightly` does not gate merges.
  frontend:
    name: >-
      Frontend · ${{ matrix.os }} · py${{ matrix.python }} · torch ${{ matrix.torch }}${{
      matrix.hf && ' + transformers' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.torch == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than generated: the supported Python range differs
        # per torch version, so a cross product would schedule jobs that cannot
        # install. torch 2.1 ships cp38-cp311 wheels only.
        include:
          - { os: ubuntu-latest,  python: "3.10", torch: min }
          - { os: windows-latest, python: "3.10", torch: min }
          - { os: ubuntu-latest,  python: "3.12", torch: current }
          - { os: windows-latest, python: "3.12", torch: current }
          - { os: ubuntu-latest,  python: "3.13", torch: current }
          # Semantic and KV-cache detection lean on upstream implementation
          # conventions, so one leg runs real transformers model/cache code.
          - { os: ubuntu-latest,  python: "3.12", torch: current, hf: true }
          # Early warning for upstream breakage; never blocks a merge.
          - { os: ubuntu-latest,  python: "3.12", torch: nightly }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyTorch (${{ matrix.torch }})
        shell: bash
        run: |
          python -m pip install --upgrade pip
          case "${{ matrix.torch }}" in
            min)
              # Oldest version the frontend claims to support. TorchDispatchMode
              # and StorageWeakRef are private APIs, so the floor is asserted by
              # test rather than by trust.
              pip install "torch==2.1.*" --index-url https://download.pytorch.org/whl/cpu
              ;;
            current)
              pip install torch --index-url https://download.pytorch.org/whl/cpu
              ;;
            nightly)
              pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
              ;;
          esac

      - name: Install InferRef
        run: pip install -e ".[dev]"

      - name: Install transformers
        if: matrix.hf
        run: pip install "transformers>=4.40"

      - name: Report versions
        shell: python
        run: |
          import sys, numpy, torch
          print(f"python {sys.version.split()[0]}")
          print(f"torch  {torch.__version__}")
          print(f"numpy  {numpy.__version__}")
          try:
              import transformers
              print(f"transformers {transformers.__version__}")
          except ImportError:
              print("transformers not installed (real-model tests will skip)")

      - name: Check the private PyTorch APIs the tracer depends on
        shell: python
        run: |
          import sys
          missing = []
          try:
              from torch.utils._python_dispatch import TorchDispatchMode  # noqa: F401
          except Exception as exc:
              missing.append(f"TorchDispatchMode: {exc}")
          try:
              from torch.multiprocessing.reductions import StorageWeakRef  # noqa: F401
          except Exception as exc:
              missing.append(f"StorageWeakRef: {exc}")
          import torch.nn.modules.module as m
          for hook in ("register_module_forward_pre_hook", "register_module_forward_hook"):
              if not hasattr(m, hook):
                  missing.append(f"nn.modules.module.{hook}")
          if missing:
              sys.exit("private APIs unavailable:\n  " + "\n  ".join(missing))
          print("all required PyTorch APIs are present")

      - name: Run full suite
        run: python -m pytest tests -q

      - name: Run the documented end-to-end loop
        shell: bash
        run: |
          set -euo pipefail
          python examples/mini_llama/run_trace.py --output trace/
          inferref validate trace/
          inferref analyze trace/ --json > /dev/null

          # Semantic detection finds the RoPE region on its own; no operator
          # ids appear anywhere in this workflow.
          inferref region detect trace/
          inferref testcase extract trace/ --region "RoPE@layers.0.self_attn" \
            -o repro/rope \
            --input-names cos,sin,query,key --output-names q_embed,k_embed

          python examples/engine_sim/rope_numpy.py repro/rope --output engine-out/
          inferref compare repro/rope engine-out/ --first-failure

          # A wrong engine must fail, otherwise the comparator proves nothing.
          python examples/engine_sim/rope_numpy.py repro/rope --output engine-bad/ --inject-bug
          if inferref compare repro/rope engine-bad/ --first-failure; then
            echo "::error::comparator reported PASS for a deliberately broken engine"
            exit 1
          fi
          echo "end-to-end loop behaved correctly in both directions"

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.os }}-py${{ matrix.python }}-torch-${{ matrix.torch }}${{ matrix.hf && '-hf' || '' }}
          path: |
            trace/
            repro/
          retention-days: 7
          if-no-files-found: ignore

  # The engine-side contract: the reader must build and agree with Python
  # without linking anything.
  cpp:
    name: C++ reader · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build --config Release

      - name: Run C++ self-test
        run: ctest --test-dir cpp/build --output-on-failure -C Release

      - name: Cross-language agreement
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

          python examples/mini_llama/run_trace.py --output trace/
          inferref region detect trace/
          inferref testcase extract trace/ --region "RoPE@layers.0.self_attn" \
            -o repro/rope \
            --input-names cos,sin,query,key --output-names q_embed,k_embed
          python examples/engine_sim/rope_numpy.py repro/rope --output engine-out/

          BIN=cpp/build/inferref_compare
          [ -x "$BIN" ] || BIN=cpp/build/Release/inferref_compare.exe

          # Same verdict as `inferref compare`, computed without PyTorch.
          "$BIN" repro/rope/reference/q_embed.irtensor engine-out/q_embed.irtensor

          python examples/engine_sim/rope_numpy.py repro/rope --output engine-bad/ --inject-bug
          if "$BIN" repro/rope/reference/q_embed.irtensor engine-bad/q_embed.irtensor; then
            echo "::error::C++ comparator reported PASS for a broken engine"
            exit 1
          fi
          echo "C++ and Python comparators agree in both directions"

name: PyTorch nightly

# The frontend may break against a new PyTorch; the Trace IR may not. This runs
# on a schedule so upstream breakage surfaces as a red run in the Actions tab
# rather than as a `continue-on-error` job nobody looks at.

on:
  schedule:
    # Mondays 06:17 UTC — off the hour to avoid the scheduler's rush.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  nightly:
    name: Frontend vs torch nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install torch nightly
        run: |
          python -m pip install --upgrade pip
          pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          pip install -e ".[dev]"

      - name: Report versions
        shell: python
        run: |
          import torch
          print(f"torch {torch.__version__}")

      - name: Check the private PyTorch APIs the tracer depends on
        shell: python
        run: |
          import sys
          missing = []
          try:
              from torch.utils._python_dispatch import TorchDispatchMode  # noqa: F401
          except Exception as exc:
              missing.append(f"TorchDispatchMode: {exc}")
          try:
              from torch.multiprocessing.reductions import StorageWeakRef  # noqa: F401
          except Exception as exc:
              missing.append(f"StorageWeakRef: {exc}")
          import torch.nn.modules.module as m
          for hook in ("register_module_forward_pre_hook", "register_module_forward_hook"):
              if not hasattr(m, hook):
                  missing.append(f"nn.modules.module.{hook}")
          if missing:
              sys.exit("private APIs unavailable:\n  " + "\n  ".join(missing))
          print("all required PyTorch APIs are present")

      - name: Core suite must be unaffected
        run: python -m pytest tests/core -q

      - name: Slow contract acceptance gate
        run: python -m pytest tests/core -m slow -q

      - name: Frontend suite
        run: python -m pytest tests/frontend -q
